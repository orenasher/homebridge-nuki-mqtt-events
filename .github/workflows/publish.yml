name: Publish
# Publishes to npm (trusted publishing, no token) and makes a GitHub release
# whenever main gets a version that is not on npm yet. Also runs from a v* tag or by hand.
on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ['v*']
  workflow_dispatch:
jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Skips when this version is already on npm
      - run: |
          NAME=$(node -p "require('./package.json').name"); VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then echo "$NAME@$VER is already on npm"; else npm publish --access public; fi
  release:
    # GitHub release with this version's notes from CHANGELOG.md — Homebridge UI shows them when updating
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Release notes
        run: |
          v=$(node -p "require('./package.json').version")
          echo "TAG=v$v" >> "$GITHUB_ENV"
          [ -f CHANGELOG.md ] && awk -v v="$v" '/^## /{p=($2==v)} p' CHANGELOG.md | tail -n +2 > notes.md || true
          [ -s notes.md ] || echo "Version $v" > notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
